# OCR Intelligence - local stack: PostgreSQL, Redis, Django, Celery worker, Vite dev server.
# Usage:  copy .env.example .env  &&  docker compose up --build

x-backend-env: &backend-env
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    MEDIA_ROOT: /app/media
    PADDLE_PDX_CACHE_HOME: /models

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocr_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocr} -d ${POSTGRES_DB:-ocr_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: ocr-intelligence-backend
    <<: *backend-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - ocr_models:/models
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ocr-intelligence-backend
    <<: *backend-env
    # One OCR task at a time: PP-StructureV3 on CPU is memory- and thread-hungry.
    command: >
      sh -c "celery -A config worker -l info --concurrency=$${CELERY_WORKER_CONCURRENCY:-1}"
    volumes:
      - media_data:/app/media
      - ocr_models:/models
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
  ocr_models:
